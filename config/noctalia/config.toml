[backdrop]
enabled = true

[bar.default]
center = [ "group:g1" ]
end = [ "group:g2", "group:g4" ]
font_family = "JetBrainsMono NF"
font_weight = 700
margin_ends = 0
radius = 0
start = [ "group:g3", "workspaces", "tray" ]

    [bar.default.dead_zone.actions]
    left = "panel-toggle control-center home"

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "audio_visualizer", "media", "audio_visualizer" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "brightness", "battery", "network" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g3"
    members = [ "session", "control-center", "notifications", "launcher" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g4"
    members = [ "date", "clock" ]
    opacity = 1.0
    padding = 6.0

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 128.0
    box_width = 810.0
    cx = 720.0
    cy = 778.0
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1440.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = false
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = false

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 0.0
    box_width = 0.0
    cx = 720.0
    cy = 404.5
    output = "eDP-1"
    placement_height = 960.0
    placement_width = 1440.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        format = "{:%a %d %b\\n%I:%M %p}"

[shell]
polkit_agent = true
time_format = "{:%I:%M}"

    [shell.launcher.providers.session]
    global = true

[theme]
community_palette = "Everforest"
source = "community"

[wallpaper]
directory = "/home/max/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/max/Pictures/Wallpapers/garden_of_words_laptop.jpg"

[widget.clock]
format = "{:%I:%M:%S %p}"

[widget.media]
hide_album_art = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.tray]
capsule = true

[widget.workspaces]
capsule = true
